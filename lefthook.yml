pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{js,jsx,ts,tsx,json,css,scss,md}'
      run: pnpm prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{js,jsx,ts,tsx}'
      run: pnpm eslint --fix {staged_files}
      stage_fixed: true

pre-push:
  parallel: false
  commands:
    lint:
      run: pnpm lint
    type-check:
      run: pnpm type-check
    build:
      run: pnpm build
